<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <title>Pix</title>
    <script>
      // 首屏主题落定（规格 §6.2）：必须在样式表与包体之前跑完，否则暗色用户
      // 会看到一帧白屏。键与 web/src/lib/theme.ts 的 THEME_STORAGE_KEY 一致，
      // 取值兼容 zustand persist 的 {state:{theme}} 与裸字符串。
      ;(() => {
        // PWA 视口固定（禁止双指缩放）：iOS Safari 对 user-scalable=no 支持不稳，补 gesturestart 拦截
        document.addEventListener("gesturestart", (e) => {
          e.preventDefault()
        })

        const root = document.documentElement
        const meta = document.querySelector('meta[name="theme-color"]')
        let theme = "auto"
        try {
          const stored = localStorage.getItem("app-theme")
          if (stored) {
            try {
              theme = JSON.parse(stored)?.state?.theme ?? stored
            } catch {
              theme = stored
            }
          }
        } catch {
          // localStorage 被禁用时按系统外观走，不阻塞渲染
        }
        if (theme !== "light" && theme !== "dark") theme = "auto"
        const dark =
          theme === "dark" ||
          (theme === "auto" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches)
        root.classList.toggle("dark", dark)
        root.style.colorScheme = dark ? "dark" : "light"
        if (meta) meta.setAttribute("content", dark ? "#0a0a0a" : "#ffffff")
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
