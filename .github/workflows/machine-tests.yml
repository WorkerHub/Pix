name: Machine tests

on:
  pull_request:
    paths:
      - "machine/**"
      - ".github/workflows/machine-tests.yml"
  push:
    branches: [main]
    paths:
      - "machine/**"
      - ".github/workflows/machine-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: machine-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Machine tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 测试环境采用与生产 Dockerfile 一致的基础镜像：CPU 版 PyTorch + ComfyUI v0.9.2 + 运行依赖。
      # gha 缓存按 Git ref 隔离（与 tag 触发的 docker-publish 不共享），此处指定独立 scope=machine-tests；
      # 首跑/无缓存时进行冷构建，同 PR 再次推送或 main 分支热缓存命中时仅重建 machine 代码层。
      - name: Build machine image
        uses: docker/build-push-action@v6
        with:
          context: machine
          file: machine/Dockerfile
          load: true
          tags: pix-service:test
          cache-from: type=gha,scope=machine-tests
          cache-to: type=gha,mode=max,scope=machine-tests

      # .dockerignore 排除了 tests（生产镜像瘦身），测试代码经 volume 挂载注入；
      # 覆盖 ENTRYPOINT 直接跑 pytest，不起 ComfyUI/proxy。
      # 不设 SKIP_MODEL_DOWNLOAD：契约测试依赖其默认 False 走真实就绪门逻辑。
      - name: Run machine pytest
        run: |
          docker run --rm \
            --entrypoint bash \
            -v "${{ github.workspace }}/machine:/app/machine" \
            -e COMFYUI_DIR=/app/ComfyUI \
            pix-service:test \
            -c "pip install --quiet pytest anyio && python -m pytest machine/tests -q"
