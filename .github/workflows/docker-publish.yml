name: docker-publish

on:
  push:
    tags: ["server-v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub 需要在仓库 Settings → Secrets 里配置
      # DOCKERHUB_USERNAME 与 DOCKERHUB_TOKEN（Access Token）后才会启用；
      # 没配置时自动跳过，GHCR 照常发布。
      - name: Login to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          GHCR_REPO="ghcr.io/workerhub/pix-server"
          DH_REPO="docker.io/workerhub/pix-server"

          TAGS="${GHCR_REPO}:latest"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            TAGS="$TAGS,${DH_REPO}:latest"
          fi

          if [ "${{ github.ref_type }}" = "tag" ]; then
            RAW_TAG="${{ github.ref_name }}"
            VER_TAG="${RAW_TAG#server-}"
            TAGS="$TAGS,${GHCR_REPO}:${VER_TAG},${GHCR_REPO}:${RAW_TAG}"
            if [ -n "$DOCKERHUB_USERNAME" ]; then
              TAGS="$TAGS,${DH_REPO}:${VER_TAG},${DH_REPO}:${RAW_TAG}"
            fi
          fi

          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: machine
          file: machine/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
